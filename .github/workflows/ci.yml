name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check bin/fikrado.js
          node --check lib/menu.js
          node --check lib/ui.js
          node --check lib/config.js
          node --check lib/ai.js
          node --check lib/report.js
          node --check lib/scanners/malware.js
          node --check lib/scanners/network.js
          node --check lib/scanners/server.js
          node --check lib/scanners/ad.js
        shell: bash

      - name: Unit + integration tests
        run: node --test 'test/*.js'
        shell: bash

      # Scans an empty temp dir on purpose: the repo's test fixtures contain the
      # EICAR string and webshell snippets, so scanning `test/` would correctly
      # report threats and exit non-zero.
      - name: CLI smoke test
        run: |
          node bin/fikrado.js --version
          node bin/fikrado.js --help
          node bin/fikrado.js keys list
          node bin/fikrado.js report list
          node bin/fikrado.js quarantine list

          CLEAN_DIR="$(mktemp -d)"
          node bin/fikrado.js scan "$CLEAN_DIR" --no-report
          rm -rf "$CLEAN_DIR"
        shell: bash
